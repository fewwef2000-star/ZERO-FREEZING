<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>zero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    #main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    #logo {
      width: min(70vw, 280px);
      height: min(70vw, 280px);
      cursor: pointer;
      transition: transform 0.15s;
    }
    #logo:active { transform: scale(0.95); }
    #hint {
      margin-top: 20px;
      color: #aaa;
      font-size: 16px;
    }
    /* Popup overlay */
    #popupOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #popupOverlay.show { display: flex; }
    #popup {
      background: #1A1A2E;
      border: 2px solid #00BFFF;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      animation: popIn 0.25s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    #freezeImg {
      width: 100%;
      max-height: 90px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    /* Custom switch that looks like the image */
    .switch-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 16px;
      position: relative;
    }
    .switch {
      position: relative;
      width: 70px;
      height: 36px;
      background: #555;
      border-radius: 36px;
      transition: background 0.25s;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0,191,255,0.3);
    }
    .switch.on {
      background: #00BFFF;
      box-shadow: 0 0 16px rgba(0,191,255,0.6);
    }
    .switch .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 30px;
      height: 30px;
      background: #fff;
      border-radius: 50%;
      transition: left 0.25s, background 0.25s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .switch.on .knob {
      left: 37px;
      background: #fff;
    }
    #status {
      font-size: 14px;
      margin-bottom: 14px;
      color: #00BFFF;
    }
    #status.off { color: #aaa; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: #0080FF;
      color: #fff;
    }
    .btn-secondary {
      background: #333;
      color: #fff;
    }
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>

      <div class="switch-wrap">
        <div id="switch" class="switch on">
          <div class="knob"></div>
        </div>
      </div>
      
      <div id="status">สถานะ: เปิด (แช่แข็ง)</div>
      
      <button class="btn btn-primary" id="btnShare">แชร์แอปนี้ให้เพื่อน</button>
      <button class="btn btn-secondary" id="btnClose">ปิด</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Replace placeholders with actual base64 (done outside)
    const logo = document.getElementById('logo');
    const popupOverlay = document.getElementById('popupOverlay');
    const switchEl = document.getElementById('switch');
    const statusEl = document.getElementById('status');
    const btnClose = document.getElementById('btnClose');
    const btnShare = document.getElementById('btnShare');
    const toast = document.getElementById('toast');

    let isOn = true;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    logo.addEventListener('click', () => {
      popupOverlay.classList.add('show');
    });

    btnClose.addEventListener('click', () => {
      popupOverlay.classList.remove('show');
    });

    popupOverlay.addEventListener('click', (e) => {
      if (e.target === popupOverlay) popupOverlay.classList.remove('show');
    });

    switchEl.addEventListener('click', () => {
      isOn = !isOn;
      switchEl.classList.toggle('on', isOn);
      if (isOn) {
        statusEl.textContent = 'สถานะ: เปิด (แช่แข็ง)';
        statusEl.classList.remove('off');
        showToast('เปิดแช่แข็ง');
      } else {
        statusEl.textContent = 'สถานะ: ปิด';
        statusEl.classList.add('off');
        showToast('ปิดแช่แข็ง');
      }
    });

    btnShare.addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: 'zero',
          text: 'แอป zero - แช่แข็ง',
          url: window.location.href
        }).catch(() => {});
      } else {
        showToast('คัดลอกลิงก์แล้ว (หรือส่งไฟล์ HTML นี้ให้เพื่อน)');
      }
    });
  </script>
